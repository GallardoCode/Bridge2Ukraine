# Local development: Postgres only. The app runs on the host with `pnpm dev`
# (hot reload, no image rebuilds). Port 5433 avoids clashing with a local Postgres.
name: b2u-poc-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: bridge2ukraine
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      # Creates the extra database that `pnpm test` wipes and migrates.
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d bridge2ukraine']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
